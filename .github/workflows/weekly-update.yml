name: Monday K League refresh

on:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Commit verified weekly stamp
        run: |
          git config user.name "k-league-ink-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: Monday K League refresh"
          git push
